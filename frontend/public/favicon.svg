<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The site's own accent blue (tokens.css series-1 token, light mode),
       not a new colour, hardcoded rather than read from a custom property:
       a favicon is the one asset that has to look right with zero page CSS
       loaded. Bold system sans rather than the Big Shoulders Display
       webfont, since a favicon renders before, and often without, any page
       fetch completing, so it cannot depend on a font request landing. -->
  <rect width="32" height="32" rx="7" fill="#2a78d6" />
  <text
    x="16"
    y="17"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="19"
    fill="#fcfcfb"
  >W</text>
</svg>
