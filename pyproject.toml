[project]
name = "wnba-engine"
version = "0.1.0"
description = "Open WNBA data & analytics engine: box scores, player stats, and odds/outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.1",
  "click>=8.1",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Modeling only. Deliberately optional: ingestion, validation and the
# feature layer must stay installable without a compiler toolchain.
modeling = ["scikit-learn>=1.5", "numpy>=2.0"]
# The read-only HTTP API (wnba_engine/api/). Optional for the same reason as
# modeling: the ingest pipeline is the part that must stay trivially
# installable, and a contributor running backfills has no use for a web server.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# Mirroring team logos and player headshots into S3-compatible storage
# (wnba_engine/assets/). Optional for the same reason as the others: nothing in
# the ingest path needs an object-store client.
assets = ["boto3>=1.35"]

[project.scripts]
wnba-engine = "wnba_engine.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wnba_engine"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults, which is exactly how
# FastAPI declares dependencies and query-parameter metadata -- `Depends(...)`
# and `Query(...)` in the signature IS the framework's interface. Scoped to the
# route modules so the rule keeps applying everywhere it catches real bugs.
"wnba_engine/api/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a reachable Postgres (docker compose up -d); skips otherwise",
]
